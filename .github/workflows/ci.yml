name: PrintERP SaaS CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type Check, Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://dummy-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci-build-verification
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_DEFAULT_LOCALE: bn
      NEXT_PUBLIC_DEFAULT_CURRENCY: BDT

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 24 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Type Check (TypeScript)
        run: npm run typecheck

      - name: 2. Code Quality & Standards (ESLint)
        run: npm run lint

      - name: 3. Comprehensive Automated Tests (Node Native Test Runner)
        run: npm test

      - name: 4. Optimized Production Build
        run: npm run build
